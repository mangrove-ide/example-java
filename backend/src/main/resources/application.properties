spring.application.name=crm-backend
server.port=${PORT:4000}
crm.database-path=${DATABASE_PATH:data/crm.sqlite}
spring.datasource.url=jdbc:sqlite:${crm.database-path}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer at a time; a single pooled connection keeps it simple and safe.
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always
spring.main.banner-mode=off
